<div class="w-full">
  <!-- Top Section -->
  <div class="flex flex-row flex-wrap gap-4 items-center">
    <div
      class="bg-gradient-to-r from-indigo-400 to-blue-500 rounded-lg py-2 w-48 xl:w-80 h-32 lg:h-40 xl:12rem flex flex-col items-center justify-center">
      <p class="uppercase text-gray-200 mb-2">Current Balance</p>
      <p class="text-xl xl:text-2xl text-white font-semibold mt-2">৳{{totalBalance}} TK</p>
    </div>
    <app-acc-pie-chart />
    <app-acc-horizontal-bar-chart />
  </div>
  <!-- Cards Section -->
  <p-divider />
  <div>
    <p class="font-semibold text-lg">Cards</p>
    <div class="flex items-center gap-6">
      @for (account of accountData; track account.id) {
      <app-money-card [account]="account" />
      }
    </div>
  </div>
</div>
